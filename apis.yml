name: Monument Bank
kind: company
description: >-
  Monument Bank Limited is a UK challenger bank headquartered at 33 Cavendish
  Square, London, purpose-built for the "mass affluent" - professionals,
  entrepreneurs, and savers with substantial assets who have historically been
  underserved between mainstream retail banking and private banking. It received
  a full UK banking licence in November 2021, launched its first app-based
  savings products in early 2022, and in 2024 joined Tech Nation's Future Fifty
  cohort of leading pre-IPO companies. Monument is authorised by the Prudential
  Regulation Authority (PRA) and regulated by the Financial Conduct Authority
  (FCA) and PRA under FRN 849724, with eligible deposits protected by the FSCS.
  It is privately held (investors include Dubai Investments, which took a ~9%
  stake) and operates the technology it spun out as Monument Technology. Its
  current product suite is app-only savings - easy access accounts, cash ISAs,
  limited access savers, notice accounts, and fixed-term deposits - plus a
  planned move into buy-to-let and property lending. As a smaller,
  savings-and-lending-focused ASPSP it is NOT one of the CMA9 mandated banks and
  does not publish a public developer portal; where it participates in UK Open
  Banking it does so against the Open Banking Implementation Entity (OBIE) Open
  Data and Read/Write API Standards under the PSD2 / FCA framework, secured with
  FAPI-grade OAuth2/OIDC, mutual-TLS, and PSD2 strong customer authentication.
