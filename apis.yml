apis:
- aid: monument-bank:monument-open-data-api
  name: Monument Bank Open Data API
  description: >-
    UK Open Banking Open Data API - the PUBLIC, unauthenticated reference-data
    surface defined by the OBIE Open Data Standard (product, ATM, branch, PCA,
    BCA, SME loan, and commercial credit card reference data). Represented here
    against the shared OBIE Open Data Standard; Monument does not publish a
    confirmed public Open Data endpoint (its API host api.monument.co responds
    403 / access-controlled), so this entry is UNVERIFIED for Monument and the
    harvested spec is the shared standard, not a Monument contract.
  humanURL: https://github.com/OpenBankingUK/opendata-api-spec-compiled
  baseURL: https://api.monument.co/open-data/v2.3
  tags:
  - Open Data
  - Reference Data
  - Public
  properties:
  - type: OpenAPI
    url: openapi/obie-opendata-swagger.json
  - type: Documentation
    url: https://github.com/OpenBankingUK/opendata-api-spec-compiled
  - type: APIReference
    url: https://openbankinguk.github.io/opendata-api-docs-pub/
- aid: monument-bank:monument-account-info-api
  name: Monument Bank Account and Transaction Information API
  description: >-
    UK Open Banking Read/Write Account & Transaction Information (AIS) API per
    the OBIE Read/Write API Standard - accounts, balances, transactions,
    beneficiaries, standing orders, direct debits, statements, and parties for
    authorised AISP third parties. FAPI-secured (OAuth2/OIDC, mTLS, PSD2 SCA).
    Represented against the shared OBIE standard; Monument publishes no public
    developer portal and the harvested spec is the OBIE standard, not a Monument
    contract - UNVERIFIED for Monument.
  humanURL: https://github.com/OpenBankingUK/read-write-api-specs
  baseURL: https://api.monument.co/open-banking/v3.1/aisp
  tags:
  - Account Information
  - AIS
  - Read/Write
  properties:
  - type: OpenAPI
    url: openapi/obie-account-info-openapi.yaml
  - type: Documentation
    url: https://github.com/OpenBankingUK/read-write-api-specs
  - type: APIReference
    url: https://openbankinguk.github.io/read-write-api-docs-pub/v3.1.11/
- aid: monument-bank:monument-payment-initiation-api
  name: Monument Bank Payment Initiation API
  description: >-
    UK Open Banking Read/Write Payment Initiation (PIS) API per the OBIE
    Read/Write API Standard - domestic, scheduled, standing-order,
    international, and file payment initiation for authorised PISP third
