  - type: APIReference
    url: https://openbankinguk.github.io/read-write-api-docs-pub/v3.1.11/
- aid: monument-bank:monument-confirmation-of-funds-api
  name: Monument Bank Confirmation of Funds API
  description: >-
    UK Open Banking Read/Write Confirmation of Funds (CBPII) API per the OBIE
