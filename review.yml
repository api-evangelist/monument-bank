aid: monument-bank
name: Monument Bank
review:
  question: >-
    Does Monument Bank expose a public developer portal, a confirmed UK Open
    Banking Open Data endpoint, and documented OBIE Read/Write conformance?
  answer: false
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    Monument Bank Limited (FRN 849724, PRA-authorised, FCA/PRA-regulated) is a
    UK challenger bank serving the mass-affluent segment with an app-only
    savings proposition (easy access, cash ISAs, limited access savers, notice
    accounts, fixed-term deposits) and planned property lending. It is NOT one
    of the CMA9 mandated banks.

    No public developer portal, sandbox, API catalogue, or getting-started
    surface could be found. Probes of the usual hosts and paths - developer.
    and developers.monument.co (DNS did not resolve, curl 000),
    monument.co/developer, /developers, /open-banking, /api (all HTTP 404) -
    turned up nothing. The bank operates a real API host at api.monument.co,
    but every request to it (root, /open-banking/v3.1/aisp,
    /open-banking/v2.3/atms, /open-data/v2.3/atms,
    /.well-known/openid-configuration) returned HTTP 403 (access-controlled /
    WAF-gated), so no endpoint could be confirmed with a 200. No
    /.well-known/security.txt (404) and no OBIE Ozone manifest were found.

    NO live Open Data endpoint was confirmed for Monument. Because Monument's
    accounts are savings/deposit products rather than online-accessible payment
    accounts, it is likely out of scope for, or a limited participant in, the
    mandatory Open Data / Read-Write regime. Where it does participate it would
    conform to the OBIE Open Data and Read/Write API Standards.

    Spec provenance: the four specifications harvested into openapi/ are the
    SHARED OBIE UK Open Banking standard documents pulled verbatim from the
    Open Banking Ltd GitHub organisation - they are the standard, NOT
    Monument-proprietary contracts, and are labelled as such throughout apis.yml
    and this review. The Read/Write auth model per the standard is FAPI-grade
    OAuth2/OIDC + mutual-TLS + PSD2 strong customer authentication, with
    dynamic client registration using OBIE/eIDAS certificates.
  developerPortal:
    found: false
    note: No developer.* host resolves; no /developer, /developers, /open-banking, or /api page on www.monument.co (all 404).
  openDataConfirmed: false
  openDataBaseURL: ""
  readWriteConformance:
    standard: OBIE Read/Write API Standard v3.1
    authModel: FAPI OAuth2/OIDC + mutual-TLS + PSD2 SCA + OBIE/eIDAS dynamic client registration
    specProvenance: OBIE-standard (shared), not Monument-proprietary
    verifiedForMonument: false
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.monument.co
      documented: false
      note: Host resolves but returns HTTP 403 to all probed paths; no public documentation. Endpoints unverified.
    - protocol: REST
      scheme: https
      note: OBIE Open Data reference-data surface (products/ATMs/branches/PCA/BCA/SME loans/commercial credit cards) per the shared standard. No Monument endpoint confirmed.
      documented: false
  probes:
    - url: https://www.monument.co/
      status: 200
    - url: https://api.monument.co/
      status: 403
    - url: https://api.monument.co/open-banking/v3.1/aisp
      status: 403
    - url: https://api.monument.co/open-banking/v2.3/atms
      status: 403
    - url: https://api.monument.co/open-data/v2.3/atms
      status: 403
    - url: https://api.monument.co/.well-known/openid-configuration
      status: 403
    - url: https://developer.monument.co/
      status: 000
    - url: https://www.monument.co/developer
      status: 404
    - url: https://www.monument.co/.well-known/security.txt
      status: 404
sources:
