    description: The requested representation (Accept header) is not supported.
  - status: 409
    title: Conflict
    description: The request conflicts with the current state (e.g. duplicate consent/payment).
  - status: 415
    title: Unsupported Media Type
    description: The request Content-Type is not supported.
  - status: 422
    title: Unprocessable Entity
    description: The request was well-formed but semantically invalid per OBIE rules.
    envelope: OBErrorResponse1
  - status: 429
    title: Too Many Requests
    description: Rate limit exceeded; retry after the indicated interval.
  - status: 500
    title: Internal Server Error
    description: An unexpected error occurred at the ASPSP.
